services:
  postgres:
    image: postgres:15
    container_name: stock_postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  airflow-init:
    image: apache/airflow:2.8.1
    container_name: stock_airflow_init
    env_file:
      - .env
    depends_on:
      - postgres
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs

  airflow-webserver:
    image: apache/airflow:2.8.1
    container_name: stock_airflow_web
    restart: always
    depends_on:
      - airflow-init
    env_file:
      - .env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.8.1
    container_name: stock_airflow_scheduler
    restart: always
    depends_on:
      - airflow-init
    env_file:
      - .env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
    command: scheduler

  api:
    image: python:3.11-slim
    container_name: stock_api
    working_dir: /app
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    command: python -m http.server 8000

volumes:
  postgres_data: